<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO PRODUTOS - ESPORTESls</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="form-page">
    <form onsubmit="cadastrarProduto(); return false;">
    <h2>Cadastro de Produtos</h2>

    <fieldset>
      <legend>Nome</legend>
      <input id="nome" type="text" placeholder="Nome do produto" required />
    </fieldset>

     <fieldset>
      <legend>Quantidade</legend>
      <input id="quantidade" type="text" placeholder="Quantidade do produto" required />
    </fieldset>

    <fieldset>
      <legend>Preço</legend>
      <input id="preco" type="text" placeholder="Preço do produto" required />
    </fieldset>

    <fieldset>
      <legend>Descrição</legend>
      <input id="descricao" type="text" placeholder="Descrição do produto" required />
    </fieldset>

    <fieldset>
      <legend>URL</legend>
      <input id="url" type="text" placeholder="URL do produto" required />
    </fieldset>

    <div class="form-actions">
      <a href="index.html" class="btn">Cancelar</a>
      <button class="btn" type="submit">Salvar</button>
    </div>

    <p id="mensagem"></p>
  </form>

  <script src="/frontend/js/CadastroProdutos.js"></script>
</body>
</html>
