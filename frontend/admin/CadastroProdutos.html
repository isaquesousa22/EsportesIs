<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO PRODUTOS - ESPORTESls</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="form-page">
    <form onsubmit="cadastrar(); return false;">
    <h2>Criar Conta</h2>

    <fieldset>
      <legend>Nome</legend>
      <input id="nome" type="text" placeholder="Seu nome" required />
    </fieldset>

     <fieldset>
      <legend>CPF</legend>
      <input id="cpf" type="text" placeholder="Seu CPF" required />
    </fieldset>

    <fieldset>
      <legend>Endereço</legend>
      <input id="endereco" type="text" placeholder="Seu endereço" required />
    </fieldset>

    <fieldset>
      <legend>Email</legend>
      <input id="emailCadastro" type="email" placeholder="Seu email" required />
    </fieldset>

    <fieldset>
      <legend>Senha</legend>
      <input id="senhaCadastro" type="password" placeholder="Senha" required />
    </fieldset>

    <div class="form-actions">
      <a href="index.html" class="btn">Cancelar</a>
      <button class="btn" type="submit">Salvar</button>
    </div>

    <p id="mensagem"></p>
  </form>
</body>
</html>
