<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="shortcut icon" href="/frontend/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
  
</head>

<body class="admin-page">

    <nav class="navbar">

        <div class="admin-brand">
            <a >
                Painel Administrativo
            </a>
        </div>

        <div class="admin-logout">

            <button class="btn" onclick="location.href='/frontend/index.html'">
                Sair
            </button>

        </div>

        <h1>Olá, <span id="nome-usuario"></span>! 👋</h1>

    </nav>

    <main class="admin-content">

        <div class="admin-heading">
            <p class="admin-eyebrow">Visão geral</p>
            <h1>Bem-vindo Administrador</h1>
        </div>

        <section class="admin-stats" aria-label="Resumo de solicitações">

            <div class="stat ">

                <div class="stat-title">
                    total de produtos
                </div>

                <div class="stat-value " id="totalProdutos">
                    0
                </div>

            </div>

            <div class="stat ">

                <div class="stat-title">
                    Total de administradores
                </div>

                <div class="stat-value " id="totalAdmins">
                    0
                </div>

            <div>

                <div class="stat-title">
                    Total de clientes
                </div>

                <div class="stat-value " id="totalClientes">
                    0
                </div>

            </div>

        </section>

        <section class="admin-section" aria-label="Ações administrativas">
            <div class="admin-actions">
                <a href="CadastroAdmin.html" class="btn">
                    Cadastrar Administrador
                </a>
                  <a href="TodosAdmins.html" class="btn">
                    Todos os Administradores
                </a>
                <a href="CadastroProdutos.html" class="btn">
                    Cadastrar Produtos
                </a>
                 <a href="todosProdutos.html" class="btn">
                    Todos os Produtos
                </a>
                <a href="todosClientes.html" class="btn">
                    Todos os Parceiros
                </a>

            </div>

            <div class="admin-actions">
                <a href="suporte.html" class="btn">
                    Portal de suporte
                </a>
               
            </div>
        </section>

    </main>
    
    
    <script type="module" src="/frontend/js/admin.js"></script>
    

</body>

</html>
