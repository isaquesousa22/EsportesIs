<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EsporteIS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="form-page">

  <form onsubmit="logar(event)">
    <h2>Entrar</h2>

    <fieldset>
      <legend>Email</legend>
      <input id="emailLogin" type="email" placeholder="Seu email" required />
    </fieldset>

    <fieldset>
      <legend>Senha</legend>
      <input id="senhaLogin" type="password" placeholder="Senha" required />
    </fieldset>

    <div class="form-actions">
      <a href="index.html" class="btn">Cancelar</a>
      <button class="btn" type="submit">Entrar</button>
    </div>

    <p id="mensagem"></p>
  </form>

  <script src="js/login.js"></script>
</body>
</html>
