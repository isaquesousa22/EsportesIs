
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camisas | EsporteIS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="catalog-page">

  <header class="site-header">
    <nav class="site-nav" aria-label="Navegação principal">

      <a class="brand" href="index.html">Esporte<span>IS</span></a>

      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="tenis.html">Tênis</a></li>
        <li><a href="camisas.html" aria-current="page">Camisas</a></li>
      </ul>

      <div class="nav-actions" id="nav-actions">
        <a class="button button--quiet" href="login.html">Entrar</a>
        <a class="button button--primary" href="cadastro.html">Criar conta</a>
      </div>

    </nav>
  </header>

  <main class="content-section catalog-section">

    <div class="section-heading">
      <div>
        <p class="eyebrow">Vista suas cores</p>
        <h1>Camisas esportivas</h1>
      </div>
      <p>Encontre opções para acompanhar seu time e seu estilo.</p>
    </div>

    <section class="products" aria-label="Produtos de camisas">

      <article class="card">
        <figure>
          <img src="img_camisas/all_black.jpg" alt="Camisa Corinthians All Black">
        </figure>

        <div class="card-body">
          <p class="product-category">Camisas</p>
          <h2 class="card-title">Camisa Corinthians All Black</h2>
          <p>Edição especial em tecido respirável e design elegante.</p>

          <div class="card-actions">
            <button class="button button--primary" type="button">Comprar</button>
          </div>
        </div>
      </article>

    </section>

  </main>

  <script>
    const usuario = localStorage.getItem('usuarioLogado');
    const nav = document.getElementById('nav-actions');

    if (usuario && nav) {
      nav.innerHTML = `
        <a class="button button--quiet" href="dashboard/index.html">Meu painel</a>
        <button class="button button--primary" onclick="
          localStorage.removeItem('usuarioLogado');
          window.location.href='index.html';
        ">Sair</button>
      `;
    }
  </script>

</body>
</html>
